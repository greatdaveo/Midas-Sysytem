# Required by the KafkaProducer bean
general.kafka-topic=test-topic

# To eep Spring Kafka happy during tests
# To provide a dummy broker address, Spring will create beans but won't connect unless used.
spring.kafka.bootstrap-servers=localhost:9092

# Don't try to auto-create topics (avoids contacting a broker at startup)
spring.kafka.admin.auto-create=false

# Basic producer settings so KafkaTemplate can be built if needed.
spring.kafka.producer.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.consumer.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
