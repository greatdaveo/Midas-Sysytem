# Required by the KafkaProducer bean
general.kafka-topic=test-topic


# To create schema for each test run; drop afterwards
spring.jpa.hibernate.ddl-auto=create-drop

# To show SQL while debugging (optional)
spring.jpa.show-sql=false

# To tell the consumer to read from earliest offset (and don’t miss already-produced messages) 
spring.kafka.consumer.auto-offset-reset=earliest

# To eep Spring Kafka happy during tests
# To provide a dummy broker address, Spring will create beans but won't connect unless used.
spring.kafka.bootstrap-servers=localhost:9092

# Don't try to auto-create topics (avoids contacting a broker at startup)
spring.kafka.admin.auto-create=false

# Basic producer settings so KafkaTemplate can be built if needed.
spring.kafka.producer.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.consumer.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka consumer group for tests
spring.kafka.consumer.group-id=midas-core

# To tell Spring Kafka how to deserialize values from JSON into your class
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.jpmc.midascore,com.jpmc.midascore.*
# If the producer doesn't include type headers (or to be extra-safe), set a default type:
spring.kafka.consumer.properties.spring.json.value.default.type=com.jpmc.midascore.foundation.Transaction

# To trust the packages that contain the message types
spring.kafka.consumer.properties.spring.json.trusted.packages=com.jpmc.midascore,com.jpmc.midascore.*

# If the test messages don't include type headers, uncomment the next line and point to your class:
# spring.kafka.consumer.properties.spring.json.value.default.type=com.jpmc.midascore.foundation.Transaction

# To keep Spring from trying admin ops against a real cluster at startup
spring.kafka.admin.auto-create=false

# Harmless placeholders; @EmbeddedKafka in TaskTwoTests binds to 9092 anyway
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.producer.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# To avoid admin calls to a real cluster at startup 
spring.kafka.admin.auto-create=false

# (Optional) To help see Kafka logs during the test
logging.level.org.springframework.kafka=INFO

incentives.url=http://localhost:8080/incentive